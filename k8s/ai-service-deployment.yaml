# Unlike backend, this service is fully stateless (it reads products for
# search and calls out to `backend` for anything transactional — see
# ai-service/app/services/backend_client.py) so it's safe to run at
# replicas > 1 with no caveats.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: aegis
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: aegis-ai-service:latest # replace with your built/pushed image path
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: aegis-config }
            - secretRef: { name: aegis-secrets }
          env:
            - name: PORT
              value: "8000"
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
