#     --from-literal=POSTGRES_PASSWORD='...' \
#     --from-literal=DATABASE_URL='postgresql://aegis:...@postgres:5432/aegis' \
#     --from-literal=RAZORPAY_KEY_ID='rzp_test_...' \
#     --from-literal=RAZORPAY_KEY_SECRET='secret_...' \
#     --from-literal=RAZORPAY_WEBHOOK_SECRET='whsec_...' \
#
# Or better yet, use your cluster's secrets manager (Sealed Secrets,
# External Secrets Operator, cloud provider's KMS-backed secret store)
# instead of a plain kubectl-created Secret for anything beyond a demo.
apiVersion: v1
