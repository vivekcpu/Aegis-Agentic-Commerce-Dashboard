  DATABASE_URL: "postgresql://aegis:changeme@postgres:5432/aegis"
  RAZORPAY_KEY_ID: "rzp_test_xxxxxxxxxxxx"
  RAZORPAY_KEY_SECRET: "secret_xxxxxxxxxxxx"
  RAZORPAY_WEBHOOK_SECRET: "whsec_xxxxxxxxxxxx"
