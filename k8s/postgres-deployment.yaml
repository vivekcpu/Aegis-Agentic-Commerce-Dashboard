# Runs Postgres+pgvector inside the cluster — fine for a dev/test cluster
# (minikube, kind) or a demo. For a real production deployment, prefer a
# managed Postgres with pgvector support (Neon, Supabase, or a cloud
# provider's managed Postgres) instead of self-hosting stateful Postgres
# in Kubernetes — this Deployment+PVC exists so the whole stack can run
# with nothing but `kubectl apply -f k8s/`.
#
# Schema isn't auto-applied here (unlike docker-compose.yml's init-script
# mount) — after this pod is running, apply it via the backend image,
# which already ships schema.sql + the migrate script:
#   kubectl exec -n aegis deploy/backend -- npm run migrate
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: aegis
spec:
  replicas: 1
  strategy:
    type: Recreate # never run two Postgres pods against the same volume
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: { name: aegis-config, key: POSTGRES_USER }
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: aegis-config, key: POSTGRES_DB }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: aegis-secrets, key: POSTGRES_PASSWORD }
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "aegis"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: aegis
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
