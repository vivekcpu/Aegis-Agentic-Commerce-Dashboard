server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback so client-side routing (if added later) doesn't 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache built JS/CSS aggressively; index.html stays uncached
    location ~* \.(js|css|svg|png|jpg|jpeg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
